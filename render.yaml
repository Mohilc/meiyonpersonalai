services:
  - type: web
    name: meiyon-personal-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_NAME
        value: "Meiyon Personal AI"
      - key: AUTONOMY_MODE
        value: "SUPERVISED"
      - key: TIMEZONE
        value: "Asia/Kolkata"
      - key: HOST
        value: "0.0.0.0"
      # Telegram Bot (set these in Render Dashboard > Environment)
      - key: TELEGRAM_ENABLED
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_CHAT_ID
        sync: false
      # AI Provider Keys (set in Render Dashboard > Environment)
      - key: AI_PROVIDER
        sync: false
      - key: NVIDIA_BASE_URL
        sync: false
      - key: NVIDIA_REASONING_KEY
        sync: false
      - key: NVIDIA_GENERAL_KEY
        sync: false
      - key: NVIDIA_VISION_KEY
        sync: false
      - key: NVIDIA_MUSE_KEY
        sync: false
      - key: NVIDIA_MISTRAL_KEY
        sync: false
      - key: NVIDIA_OCR_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Google Search via SerpApi
      - key: SERPAPI_API_KEY
        sync: false
      - key: SERPAPI_DEFAULT_LOCATION
        value: "India"
      - key: SERPAPI_DEFAULT_GL
        value: "in"
      - key: SERPAPI_DEFAULT_HL
        value: "en"
      # Supabase Cloud Storage & Database Persistence
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: "meiyon-storage"
      - key: SUPABASE_AUTO_SYNC
        value: "true"
      # Gmail MCP
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ZAPIER_GMAIL_MCP_ID
        sync: false
      - key: ZAPIER_GMAIL_MCP_URL
        sync: false
      # LinkedIn MCP
      - key: LINKEDIN_LI_AT_COOKIE
        sync: false
      # Zapier Tasks & Important Data MCP
      - key: ZAPIER_TASKS_MCP_ID
        sync: false
      - key: ZAPIER_TASKS_MCP_URL
        sync: false
      # WhatsApp / Twilio (optional)
      - key: WHATSAPP_ENABLED
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
